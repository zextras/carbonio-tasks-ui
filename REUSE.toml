version = 1
SPDX-PackageName = "carbonio-tasks-ui"
SPDX-PackageSupplier = "Zextras <https://www.zextras.com>"

[[annotations]]
path = ["THIRDPARTIES", ".nvmrc", ".husky/**", ".github/**", "CHANGELOG.md", "**.json", "REUSE.toml", "Dockerfile", "pnpm-lock.yaml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 Zextras <https://www.zextras.com>"
SPDX-License-Identifier = "CC0-1.0"

# GraphQL Code Generator client-preset output: these files start with `/* eslint-disable */`,
# which prevents the license-header lint rule from injecting an SPDX header.
[[annotations]]
path = ["src/gql/gql.ts", "src/gql/graphql.ts"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Zextras <https://www.zextras.com>"
SPDX-License-Identifier = "AGPL-3.0-only"